<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI4SE Workflow Workbench</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #060a15;
      --surface: rgba(19, 27, 46, 0.72);
      --surface-2: rgba(12, 19, 35, 0.78);
      --surface-3: #0c1424;
      --border: rgba(122, 150, 210, 0.16);
      --border-strong: rgba(130, 160, 220, 0.34);
      --text: #e9f0fc;
      --muted: #93a7c9;
      --primary: #4f8ef7;
      --primary-2: #8b5cf6;
      --accent: #7aa5ff;
      --ok: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;
      --run: #38bdf8;
      --queued: #64748b;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background:
        radial-gradient(1100px 520px at 12% -10%, rgba(79, 142, 247, 0.16), transparent 60%),
        radial-gradient(900px 480px at 95% -5%, rgba(139, 92, 246, 0.13), transparent 55%),
        radial-gradient(700px 700px at 50% 120%, rgba(56, 189, 248, 0.06), transparent 60%),
        var(--bg);
      background-attachment: fixed;
    }

    .viewport { height: 100vh; overflow: hidden; }

    .layout {
      height: 100vh;
      width: 100%;
      display: grid;
      grid-template-columns: 260px 340px minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
    }
    .layout.left-collapsed { grid-template-columns: 56px 340px minmax(0, 1fr); }

    .col, .workspace { height: calc(100vh - 28px); min-width: 0; }
    .col { display: grid; grid-template-rows: 1fr; }
    .workspace { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 14px; overflow: auto; padding-right: 3px; }

    .card {
      position: relative;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(22, 30, 52, 0.66), rgba(14, 21, 38, 0.72));
      backdrop-filter: blur(16px) saturate(130%);
      -webkit-backdrop-filter: blur(16px) saturate(130%);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      padding: 14px;
      min-width: 0;
    }
    .card:hover { border-color: var(--border-strong); }

    .card-scroll { height: 100%; overflow: auto; }

    .title { margin: 0 0 4px; font-size: 16px; font-weight: 700; color: #f4f8ff; letter-spacing: 0.2px; }
    .muted { color: var(--muted); font-size: 12px; line-height: 1.5; }

    h2 { margin: 0 0 10px; font-size: 14px; font-weight: 700; color: #f1f6ff; letter-spacing: 0.2px; }
    h3 { margin: 0 0 8px; font-size: 13px; color: #e7efff; }

    label {
      display: block;
      margin: 8px 0 5px;
      color: #b9c8e6;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid rgba(108, 132, 180, 0.25);
      border-radius: 10px;
      background: rgba(9, 15, 29, 0.66);
      color: #eaf2ff;
      padding: 9px 11px;
      font-size: 12.5px;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
      caret-color: var(--primary);
    }
    input::placeholder, textarea::placeholder, select::placeholder { color: #64759a; }
    input:focus, textarea:focus, select:focus,
    input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: none;
      border-color: rgba(79, 142, 247, 0.7);
      background: rgba(11, 18, 34, 0.8);
      box-shadow: 0 0 0 3px rgba(79, 142, 247, 0.18);
    }
    textarea { min-height: 96px; resize: vertical; }

    .workbench-name {
      width: 100%;
      border: 1px solid rgba(108, 132, 180, 0.25);
      border-radius: 10px;
      background: #0a1526;
      color: #dbe9ff;
      padding: 8px 11px;
      font-size: 12.5px;
      min-height: 34px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

    .btn {
      border: 1px solid rgba(108, 138, 190, 0.28);
      background: rgba(30, 42, 68, 0.66);
      color: #dbe9ff;
      border-radius: 10px;
      padding: 7px 13px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
    }
    .btn:hover { background: rgba(42, 58, 92, 0.82); border-color: rgba(130, 160, 220, 0.45); }
    .btn:focus-visible, .task-actions button:focus-visible {
      outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 142, 247, 0.25);
    }
    .btn.primary {
      background: linear-gradient(135deg, #3b82f6, #7c3aed);
      border: 0;
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(99, 82, 240, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .btn.primary:hover {
      box-shadow: 0 8px 24px rgba(99, 82, 240, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }
    .btn.inline { padding: 6px 10px; }

    .col-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

    .collapse-rail {
      display: none;
      height: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(17, 24, 42, 0.72);
      backdrop-filter: blur(14px);
      align-items: center;
      justify-content: center;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: 12px;
      color: #b6c9ea;
      gap: 8px;
      padding: 8px 4px;
    }
    .collapse-rail button {
      writing-mode: horizontal-tb;
      border: 1px solid rgba(108, 138, 190, 0.28);
      background: rgba(30, 42, 68, 0.66);
      color: #d9e8ff;
      border-radius: 8px;
      padding: 4px 7px;
      cursor: pointer;
      font-size: 12px;
    }
    .layout.left-collapsed #left-col .card { display: none; }
    .layout.left-collapsed #left-rail { display: flex; }

    .project-list, .task-list {
      max-height: calc(100vh - 230px);
      overflow-y: auto;
      overflow-x: hidden;
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .project-item, .task-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      background: rgba(15, 24, 42, 0.6);
      cursor: pointer;
      min-width: 0;
      overflow: hidden;
      transition: border-color 0.16s ease, background 0.16s ease, transform 0.16s ease;
    }
    .project-item:hover, .task-item:hover { border-color: var(--border-strong); background: rgba(22, 34, 58, 0.72); }
    .project-item.active, .task-item.active {
      border-color: rgba(120, 150, 220, 0.55);
      background: linear-gradient(90deg, rgba(59, 130, 246, 0.2), rgba(16, 24, 42, 0.72));
      box-shadow: inset 3px 0 0 var(--primary);
    }

    .project-name, .task-name {
      font-weight: 600;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #eaf2ff;
      font-size: 13px;
    }
    .project-path { white-space: normal; overflow-wrap: anywhere; word-break: break-word; line-height: 1.35; color: #8496ba; font-size: 11.5px; }

    .task-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .task-actions { display: flex; gap: 4px; }
    .task-actions button {
      border: 1px solid rgba(108, 138, 190, 0.28);
      background: rgba(30, 42, 68, 0.66);
      color: #d9e8ff;
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .task-actions button:hover { background: rgba(42, 58, 92, 0.82); }

    .rules-grid { display: grid; gap: 12px; margin-top: 12px; }
    .rule-row { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: rgba(15, 24, 42, 0.6); }
    .rule-row label { margin-top: 0; }

    .rule-dropdown { position: relative; margin: 8px 0 6px; }
    .rule-dropdown-toggle {
      width: 100%; text-align: left; padding: 8px 12px;
      background: rgba(15, 24, 42, 0.7); color: #e6edf7;
      border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .rule-dropdown-toggle:hover { border-color: var(--border-strong); }
    .rule-menu {
      display: none; position: absolute; z-index: 20; margin-top: 5px; left: 0; right: 0;
      background: rgba(15, 23, 40, 0.96); border: 1px solid var(--border); border-radius: 12px;
      max-height: 220px; overflow: auto; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .rule-menu-item { padding: 8px 12px; cursor: pointer; font-size: 13px; transition: background 0.12s ease; }
    .rule-menu-item:hover { background: rgba(50, 70, 110, 0.4); }
    .rule-menu-item.checked { color: #9fc2ff; background: rgba(38, 58, 96, 0.5); }
    .rule-menu-empty { padding: 10px 12px; color: #8898b0; }
    .rule-tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .rule-tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(59, 130, 246, 0.16); border: 1px solid rgba(79, 142, 247, 0.28);
      border-radius: 999px; padding: 3px 9px; font-size: 12px; color: #c3d8ff;
    }
    .rule-tag button { border: 0; background: transparent; color: #9fc2ff; cursor: pointer; padding: 0 2px; font-size: 14px; line-height: 1; }

    .chips { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
    .chip {
      display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 11px; font-weight: 600;
      color: #eaf2ff; border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .chip.queued { background: rgba(100, 116, 139, 0.28); color: #b8c4d8; }
    .chip.running { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; }
    .chip.completed { background: rgba(34, 197, 94, 0.2); color: #86efac; }
    .chip.failed { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .chip.skipped { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }

    .status-stack { position: sticky; top: 0; align-self: start; display: grid; grid-template-rows: min-content minmax(0, 1fr); gap: 14px; }

    .nodes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 10px; margin-bottom: 10px; min-width: 0; }
    .node {
      border: 1px solid var(--border); border-radius: 12px; padding: 10px; background: rgba(15, 24, 42, 0.6);
      height: 132px; min-width: 0; display: flex; flex-direction: column;
    }
    .node .name { font-weight: 600; font-size: 12px; color: #eaf2ff; }
    .node .id { color: #7f95b7; font-size: 11px; margin-top: 2px; }
    .node .status-line { margin-top: 6px; }
    .node .artifact { margin-top: auto; font-size: 11px; min-height: 30px; display: flex; align-items: flex-end; }

    .artifact-link {
      color: var(--accent); cursor: pointer; background: transparent; border: 0; padding: 0;
      font-size: 13px; text-decoration: none;
    }
    .artifact-link:hover { text-decoration: underline; }

    .artifact-section-title {
      display: flex; align-items: center; gap: 9px;
      font-size: 14px; font-weight: 700; color: #ffffff; letter-spacing: 0.4px;
      margin: 16px 0 9px; padding-bottom: 7px; border-bottom: 1px solid var(--border);
    }
    .artifact-section-title::before {
      content: ""; width: 4px; height: 16px; border-radius: 2px; flex: none;
      background: linear-gradient(180deg, #6ea8fe, #a78bfa);
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
    }

    .task-files-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
    .task-file-link {
      display: block; color: var(--accent); text-decoration: underline; cursor: pointer;
      font-size: 13px; padding: 2px 0; transition: color 0.14s ease;
    }
    .task-file-link:hover { color: #aecbff; }

    .task-dir { color: #9fb3d1; font-size: 12px; font-weight: 600; margin-top: 5px; }

    .empty {
      border: 1px dashed rgba(122, 150, 210, 0.3); border-radius: 12px;
      background: rgba(16, 28, 48, 0.5); padding: 10px;
    }

    .modal-mask {
      position: fixed; inset: 0; background: rgba(3, 7, 18, 0.7);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 14px;
    }
    .modal-mask.open { display: flex; }
    .modal {
      width: min(560px, 96vw); max-height: 88vh; overflow: auto;
      border: 1px solid var(--border); border-radius: 16px;
      background: rgba(13, 20, 36, 0.92); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      padding: 16px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    #run-detail {
      margin: 0; max-height: 260px; overflow: auto;
      background: rgba(5, 9, 18, 0.85); border: 1px solid rgba(90, 114, 160, 0.22);
      border-radius: 10px; padding: 10px 12px; font-size: 11.5px; line-height: 1.5;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      color: #a9c1e8;
    }

    ::selection { background: rgba(79, 142, 247, 0.32); color: #fff; }
    * { scrollbar-width: thin; scrollbar-color: rgba(108, 132, 180, 0.4) transparent; }
    *::-webkit-scrollbar { width: 9px; height: 9px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: rgba(108, 132, 180, 0.36); border-radius: 9px; border: 2px solid transparent; background-clip: padding-box; }
    *::-webkit-scrollbar-thumb:hover { background: rgba(130, 156, 208, 0.55); background-clip: padding-box; }

  </style>
</head>
<body>
  <div class="viewport">
    <div class="layout" id="layout">
      <aside class="col" id="left-col">
        <section class="card card-scroll">
          <div class="col-head">
            <h1 class="title">项目</h1>
            <button class="btn inline" onclick="toggleLeftColumn()">缩起</button>
          </div>
          <div class="muted">选择项目后可创建并管理任务</div>
          <div class="section-actions">
            <button class="btn primary" onclick="openProjectModal('create')">+ 新建项目</button>
            <button class="btn" onclick="openProjectModal('edit')">编辑</button>
            <button class="btn" onclick="deleteCurrentProject()">删除</button>
            <button class="btn" onclick="openRulesModal()">规则</button>
          </div>
          <div id="project-list" class="project-list"></div>
        </section>
        <div id="left-rail" class="collapse-rail">
          <button onclick="toggleLeftColumn()">展开</button>
          项目列
        </div>
      </aside>

      <section class="col" id="middle-col">
        <article class="card card-scroll">
          <h2>任务列表</h2>
          <div id="project-title" class="muted">未选择项目</div>
          <div class="section-actions">
            <button class="btn primary" onclick="openTaskModal('create')">+ 新建任务</button>
            <button class="btn" onclick="loadRuns()">刷新任务状态</button>
          </div>
          <div id="task-list" class="task-list"></div>
        </article>
      </section>

      <main class="workspace" id="right-col">
        <article class="card">
          <div class="col-head">
            <h2>任务工作台</h2>
          </div>

          <label>当前任务</label>
          <div id="run-name" class="workbench-name" title="">—</div>

          <label>PRD 路径（可选，优先读取）</label>
          <input id="run-prd-path" placeholder="可填写绝对路径或相对项目路径" />

          <label>需求文本（当 PRD 路径为空时使用）</label>
          <textarea id="run-requirement" placeholder="输入或粘贴需求内容..."></textarea>

          <div class="section-actions">
            <button class="btn" onclick="toggleFlag('skipClar')" id="flag-skipclar">跳过需求澄清: 开</button>
            <button class="btn primary" onclick="startRun()">执行任务</button>
          </div>
          <div id="run-msg" class="muted" style="margin-top: 8px;"></div>
        </article>

        <div class="status-stack">
          <article class="card" style="display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 8px;">
            <div>
              <h2 style="margin-bottom: 6px;">产物与执行详情</h2>
            </div>
            <div>
              <div class="artifact-section-title">磁盘产物目录</div>
              <div id="task-files" class="task-files-tree"></div>
              <div class="artifact-section-title">日志信息</div>
              <pre id="run-detail">选择任务后可查看日志与错误信息。</pre>
            </div>
          </article>
        </div>
      </main>
    </div>
  </div>

  <div id="task-modal-mask" class="modal-mask">
    <div class="modal" style="width: min(460px, 96vw);">
      <h3 id="task-modal-title">新建任务</h3>
      <div class="muted">任务先在 UI 创建，再进入右侧工作台编辑执行内容。</div>
      <label>任务名称</label>
      <input id="task-name-input" placeholder="例如: 登录流程改造" />
      <div class="section-actions" style="margin-top: 12px;">
        <button class="btn primary" id="task-submit-btn" onclick="submitTaskForm()">创建任务</button>
        <button class="btn" onclick="closeTaskModal()">取消</button>
      </div>
      <div id="task-msg" class="muted" style="margin-top: 6px;"></div>
    </div>
  </div>

  <div id="project-modal-mask" class="modal-mask">
    <div class="modal">
      <h3 id="project-modal-title">新建项目</h3>
      <label>项目名称</label>
      <input id="bind-name" placeholder="my-project" />
      <label>项目根目录（绝对路径）</label>
      <input id="bind-path" placeholder="/path/to/project" />
      <label>文档目录（相对路径）</label>
      <input id="bind-docs" value="docs" />
      <div class="muted">创建后点“规则”配置（扫描多选）；未配置时使用内置默认规则集</div>
      <div class="section-actions" style="margin-top: 12px;">
        <button class="btn primary" id="project-submit-btn" onclick="submitProjectForm()">创建并进入</button>
        <button class="btn" onclick="closeProjectModal()">取消</button>
      </div>
      <div id="bind-msg" class="muted" style="margin-top: 6px;"></div>
    </div>
  </div>


  <div id="rules-modal-mask" class="modal-mask">
    <div class="modal">
      <h3>规则配置</h3>
      <div class="muted">项目级规则目录与节点规则文件映射；留空使用内置默认规则集（目录可独立于项目，支持绝对路径）</div>
      <label>规则目录（留空=默认；相对项目路径或绝对路径）</label>
      <input id="rules-dir-input" placeholder="留空使用默认规则集" />
      <div class="section-actions">
        <button class="btn" onclick="scanRuleFiles()">扫描文件</button>
        <button class="btn primary" onclick="saveRulesConfig()">保存规则</button>
        <button class="btn" onclick="closeRulesModal()">关闭</button>
      </div>
      <div id="rules-msg" class="muted" style="margin-top: 6px;"></div>
      <div id="rules-grid" class="rules-grid"></div>
    </div>
  </div>

  <script>
    const NODE_IDS = ["requirements_analysis", "design", "tasks", "implementation", "test_cases", "test_execution", "review", "final_report"];
    const NODE_TITLES = {
      requirements_analysis: "需求分析",
      design: "系统设计",
      tasks: "任务拆分",
      implementation: "代码实现",
      test_cases: "测试用例",
      test_execution: "执行测试",
      review: "结果评审",
      final_report: "最终报告",
    };

    const RULE_NODE_OPTIONS = [
      { id: "analyze_requirements", label: "需求分析与澄清" },
      { id: "create_plan", label: "制定计划" },
      { id: "design_test_cases", label: "设计测试用例" },
      { id: "review_plan_and_tests", label: "计划与用例评审" },
      { id: "split_tasks", label: "任务拆分" },
      { id: "implement_code", label: "代码实现" },
      { id: "verify_tests", label: "测试自验证" },
    ];

    const state = {
      projects: [],
      runs: [],
      selectedProjectId: "",
      selectedRunId: "",
      selectedRun: null,
      selectedTaskId: "",
      tasksByProject: {},
      taskModalMode: "create",
      editingTaskId: "",
      projectModalMode: "create",
      editingProjectId: "",
      taskArtifacts: { node_outputs: {}, completed_nodes: [] },
      taskFiles: [],
      ui: { leftCollapsed: false },
      ui: { leftCollapsed: false },
      flags: { skipClar: true },
    };

    const el = (id) => document.getElementById(id);

    function setTaskName(name) {
      el("run-name").textContent = name || "—";
      el("run-name").title = name || "";
    }

    function getTaskName() {
      return el("run-name").textContent.trim();
    }

    async function api(path, options = {}) {
      const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }

    function selectedProject() {
      return state.projects.find((p) => p.project_id === state.selectedProjectId) || null;
    }

    function selectedProjectTasks() {
      return state.tasksByProject[state.selectedProjectId] || [];
    }

    function selectedProjectPath() {
      return selectedProject()?.app_root || "";
    }

    function ensureProjectTaskBucket(projectId) {

    async function syncTaskFromForm() {
      if (!state.selectedProjectId || !state.selectedTaskId) return;
      const tasks = selectedProjectTasks();

        method: "PUT",

          task_name: tasks[idx].task_name,

    async function loadTaskArtifacts(taskName) {
      state.taskArtifacts = { node_outputs: {}, completed_nodes: [] };
      if (!state.selectedProjectId || !taskName) return;
      try {
        const data = await api(`/api/projects/${state.selectedProjectId}/task-artifacts?name=${encodeURIComponent(taskName)}`);
        state.taskArtifacts = { node_outputs: data.node_outputs || {}, completed_nodes: data.completed_nodes || [] };
      } catch (e) { /* ignore */ }
    }

    async function loadTaskFiles(taskName) {
      state.taskFiles = [];
      if (!state.selectedProjectId || !taskName) return;
      try {
        const data = await api(`/api/projects/${state.selectedProjectId}/task-files?name=${encodeURIComponent(taskName)}`);
        state.taskFiles = (data.files || []).filter((f) => f.name && !f.name.startsWith("."));
      } catch (e) { /* ignore */ }
      renderTaskFiles();
    }

    function renderTaskFiles() {
      const root = el("task-files");
      if (!root) return;
      root.innerHTML = "";
      if (!state.taskFiles.length) {
        root.innerHTML = '<span class="muted">磁盘目录下暂无产物文件</span>';
        return;
      }
      const items = [...state.taskFiles].sort((a, b) => (a.rel || a.name || "").localeCompare(b.rel || b.name || ""));
      const seenDirs = new Set();
      for (const f of items) {
        const rel = f.rel || f.name;
        const parts = rel.split("/");
        const depth = parts.length - 1;
        for (let i = 1; i <= depth; i++) {
          const dirPath = parts.slice(0, i).join("/");
          if (!seenDirs.has(dirPath)) {
            seenDirs.add(dirPath);
            const d = document.createElement("div");
            d.className = "task-dir";
            d.style.paddingLeft = (i - 1) * 14 + "px";
            d.textContent = dirPath + " /";
            root.appendChild(d);
          }
        }
        const a = document.createElement("a");
        a.className = "task-file-link";
        a.href = "#";
        a.style.marginLeft = depth * 14 + "px";
        a.textContent = f.name;
        a.title = f.abs || "";
        a.onclick = (e) => { e.preventDefault(); openTaskFile(f.abs); };
        root.appendChild(a);
      }
    }

    async function openTaskFile(abs) {
      if (!abs) { el("run-msg").textContent = "缺少文件路径"; return; }
      try {
        const data = await api(`/api/projects/${state.selectedProjectId}/task-files`, {
          method: "POST",
          body: JSON.stringify({ abs }),
        });
        el("run-msg").textContent = `已在访达打开: ${data.opened}`;
      } catch (err) {
        el("run-msg").textContent = String(err);
      }
    }

    async function selectTask(taskId) {
      state.selectedTaskId = taskId;
      const task = selectedProjectTasks().find((t) => t.task_id === taskId);
      if (!task) return;
      setTaskName(task.task_name || "");
      el("run-prd-path").value = task.requirement_prd_path || "";
      el("run-requirement").value = task.requirement_text || "";
      renderTaskList();
            await loadTaskArtifacts(task.task_name || "");
      await loadTaskFiles(task.task_name || "");
      const match = state.runs.find((r) => r.project_id === state.selectedProjectId && (r.requirement_name || "") === (task.task_name || ""));
      if (match) {
        state.selectedRunId = match.run_id;
        state.selectedRun = match;
        renderNodeGrid(match);
        renderRunOverview(match);
        renderRunDetail(match);
      } else {
        state.selectedRunId = "";
        state.selectedRun = null;
        renderNodeGrid(null);
        renderRunOverview(null);
        renderRunDetail(null);
      }
    }

    async function submitTaskForm() {
      const name = el("task-name-input").value.trim();
      if (!name) {
        el("task-msg").textContent = "请输入任务名称";
        return;
      }

      let projectId = (state.selectedProjectId || "").trim();
      if (!projectId) {
        await loadProjects();
        projectId = (state.selectedProjectId || "").trim();
        if (!projectId) {
          el("task-msg").textContent = "请先选择项目";
          return;
        }
      }

      // Selected project may become stale after backend restart; refresh once before creating.
      if (!state.projects.some((p) => p.project_id === projectId)) {
        await loadProjects();
        projectId = (state.selectedProjectId || "").trim();
        if (!projectId || !state.projects.some((p) => p.project_id === projectId)) {
          el("task-msg").textContent = "项目已失效，请重新选择项目后重试";
          return;
        }
      }

      ensureProjectTaskBucket(projectId);
      const tasks = selectedProjectTasks();
      try {
        if (state.taskModalMode === "edit" && state.editingTaskId) {
          const idx = tasks.findIndex((t) => t.task_id === state.editingTaskId);
          if (idx >= 0) {
            await api(`/api/projects/${projectId}/tasks/${state.editingTaskId}`, {
              method: "PUT",
              body: JSON.stringify({ task_name: name }),
            });
            tasks[idx] = { ...tasks[idx], task_name: name, updated_at: new Date().toISOString() };
            if (state.selectedTaskId === state.editingTaskId) setTaskName(name);
          }
        } else {
          const created = await api(`/api/projects/${projectId}/tasks`, {
            method: "POST",
            body: JSON.stringify({
              task_name: name,
              requirement_prd_path: "",
              requirement_text: "",
            }),
          });
          const task = created.task;
          tasks.unshift(task);
          state.selectedTaskId = task.task_id;
          setTaskName(task.task_name);
          el("run-prd-path").value = "";
          el("run-requirement").value = "";
        }
        state.tasksByProject[projectId] = tasks;
        renderTaskList();
        closeTaskModal();
      } catch (err) {
        const msg = String(err || "");
        if (msg.includes("Not found")) {
          el("task-msg").textContent = "后端任务接口未就绪，请重启 UI 服务后重试";
          return;
        }
        el("task-msg").textContent = msg;
      }
    }

    function renderRulesGrid() {
      const root = el("rules-grid");
      root.innerHTML = "";
      for (const node of RULE_NODE_OPTIONS) {
        const row = document.createElement("div");
        row.className = "rule-row";
        const selected = state.nodeRules[node.id] || [];
        const items = state.ruleFiles
          .map((f) => {
            const checked = selected.includes(f);
            return `<div class="rule-menu-item${checked ? " checked" : ""}" data-file="${f}" onclick="toggleRuleFile('${node.id}', '${f}')">${checked ? "✓&nbsp;" : ""}${f}</div>`;
          })
          .join("");
        const count = selected.length;
        row.innerHTML = `
          <label>${node.label} (${node.id})</label>
          <div class="rule-dropdown">
            <button type="button" class="rule-dropdown-toggle" id="rule-toggle-${node.id}" onclick="toggleRuleMenu('${node.id}')">${count ? `已选 ${count} 项` : "选择规则文件…"}</button>

    function buildRuleTags(nodeId) {
      const selected = state.nodeRules[nodeId] || [];
      if (!selected.length) return '<span class="muted">未绑定规则（将使用默认）</span>';
      return selected
        .map((f) => `<span class="rule-tag">${f}<button type="button" onclick="removeRuleForNode('${nodeId}', '${f}')">×</button></span>`)
        .join("");
    }

    function toggleRuleMenu(nodeId) {
      const menu = el(`rule-menu-${nodeId}`);
      const isOpen = menu.style.display !== "none";
      document.querySelectorAll(".rule-menu").forEach((m) => (m.style.display = "none"));
      menu.style.display = isOpen ? "none" : "block";
    }

    // 点规则项：勾选/取消，只更新标签与勾选态，保持下拉面板打开
    function toggleRuleFile(nodeId, file) {
      const set = new Set(state.nodeRules[nodeId] || []);
      if (set.has(file)) set.delete(file);
      else set.add(file);
      state.nodeRules[nodeId] = [...set];
      const checked = set.has(file);
      el(`rule-tags-${nodeId}`).innerHTML = buildRuleTags(nodeId);
      const item = document.querySelector(`#rule-menu-${nodeId} [data-file="${file}"]`);
      if (item) {
        item.classList.toggle("checked", checked);
        item.innerHTML = (checked ? "✓&nbsp;" : "") + file;
      }
      refreshRuleToggle(nodeId);
    }

    function refreshRuleToggle(nodeId) {
      const count = (state.nodeRules[nodeId] || []).length;
      el(`rule-toggle-${nodeId}`).textContent = count ? `已选 ${count} 项` : "选择规则文件…";
    }

    function removeRuleForNode(nodeId, file) {
      const set = new Set(state.nodeRules[nodeId] || []);
      set.delete(file);
      state.nodeRules[nodeId] = [...set];
      el(`rule-tags-${nodeId}`).innerHTML = buildRuleTags(nodeId);
      const item = document.querySelector(`#rule-menu-${nodeId} [data-file="${file}"]`);
      if (item) {
        item.classList.remove("checked");
        item.innerHTML = file;
      }
      refreshRuleToggle(nodeId);
    }

    function statusChip(status) {
      const safe = ["queued", "running", "completed", "failed", "skipped"].includes(status) ? status : "queued";
      return `<span class="chip ${safe}">${safe}</span>`;
    }

    const NODE_FILE_MAP = {
      "analyze_requirements": "01-requirements.md",
      "create_plan": "02-plan.md",
      "design_test_cases": "02-test-cases.md",
      "review_plan_and_tests": "02-plan-test-review.md",
      "split_tasks": "03-tasks.md",
      "implement_code": "04-implementation.md",
      "verify_tests": "05-test-report.md",
    };

    function deriveNodeStatuses(run) {
      const result = run?.result || {};
      const disk = state.taskArtifacts.node_outputs || {};
      // 按任务名扫到的磁盘文件（文件名→节点）注入，保证卡片一定显示磁盘产物
      const diskFiles = (state.taskFiles || []);
      const outputs = { ...disk, ...(result.node_outputs || {}) };
      const abs = {};
      const completed = new Set([...(state.taskArtifacts.completed_nodes || []), ...(result.completed_nodes || [])]);
      const appRoot = selectedProject()?.app_root || "";
      const toAbs = (v) => (v && v.startsWith("/") ? v : appRoot ? `${appRoot}/${v}` : v);
      for (const k of Object.keys(outputs)) { abs[k] = toAbs(outputs[k]); }
      for (const f of diskFiles) {
        for (const nid in NODE_FILE_MAP) {
          if (NODE_FILE_MAP[nid] === f.name) { outputs[nid] = f.abs || f.name; abs[nid] = f.abs || toAbs(f.name); completed.add(nid); break; }
        }
      }
      let currentNode = result.current_node || "";
      if (!Object.keys(outputs).length && completed.size) {
        currentNode = [...completed].pop();
      }
      return NODE_IDS.map((nodeId) => {
        let status = "queued";
        const hasOut = outputs[nodeId] || completed.has(nodeId);
        if (run?.status === "completed") {
          status = hasOut ? "completed" : "skipped";
        } else if (run?.status === "failed") {
          status = hasOut ? "completed" : (currentNode === nodeId ? "failed" : "queued");
        } else if (run?.status === "running") {
          status = hasOut ? "completed" : (currentNode === nodeId ? "running" : "queued");
        } else {
          status = hasOut ? "completed" : "queued";
        }
        return {
          nodeId,
          title: NODE_TITLES[nodeId],
          status,
          artifact: abs[nodeId] ? abs[nodeId].split("/").pop() : (hasOut ? "已生成" : "等待产物"),
          artifactAbs: abs[nodeId] || "",
        };
      });
    }

    function renderNodeGrid(run) {
      const grid = el("node-grid");
      if (!grid) return;
      grid.innerHTML = "";
      for (const node of deriveNodeStatuses(run)) {
        const hasArtifact = node.artifact && node.artifact !== "等待产物";
        const artifactHtml = hasArtifact
          ? `<button class="artifact-link" onclick="openTaskFile('${node.artifactAbs || ""}')">${node.artifact}</button>`
          : '<span class="muted">等待产物</span>';
        const card = document.createElement("div");
        card.className = "node";
        card.innerHTML = `<div class="name">${node.title}</div><div class="id">${node.nodeId}</div><div class="status-line">${statusChip(node.status)}</div><div class="artifact">${artifactHtml}</div>`;
        grid.appendChild(card);
      }
    }

    function renderRunOverview(run) {
      const box = el("run-overview");
      if (!box) return;
      box.innerHTML = "";
      if (!run) {
        box.innerHTML = '<span class="muted">尚未选择任务</span>';
        return;
      }
      const nodes = deriveNodeStatuses(run);
      const completed = nodes.filter((n) => n.status === "completed").length;
      const failed = nodes.filter((n) => n.status === "failed").length;
      const running = nodes.filter((n) => n.status === "running").length;
      box.innerHTML = `<span class="chip completed">completed ${completed}</span><span class="chip running">running ${running}</span><span class="chip failed">failed ${failed}</span>`;
    }

    function renderRunDetail(run) {
      if (!run) {
        el("run-detail").textContent = "选择任务后可查看日志与错误信息。";
        return;
      }
      const logs = (run.logs || []).slice(-15).join("\n") || "(无日志)";
      const err = run.error ? `\n\n[error]\n${run.error}` : "";
      const meta = [
        `run_id: ${run.run_id}`,
        `status: ${run.status}`,
        `tool: ${run.tool}`,
        `requirement_name: ${run.requirement_name || ""}`,
        `requirement_path: ${run.requirement_path || ""}`,
        `docs_dir: ${run.docs_dir || ""}`,
      ].join("\n");
      el("run-detail").textContent = `${meta}\n\n[logs]\n${logs}${err}`;
    }

    function toggleFlag(flag) {
      state.flags[flag] = !state.flags[flag];
      el("flag-skipclar").textContent = `跳过需求澄清: ${state.flags.skipClar ? "开" : "关"}`;
    }

    async function openArtifact(nodeId) {
      if (!state.selectedRunId) return;
      try {
        const data = await api(`/api/runs/${state.selectedRunId}/open-artifact`, {
          method: "POST",
          body: JSON.stringify({ node_id: nodeId }),
        });
        el("run-msg").textContent = `已打开目录: ${data.opened}`;
      } catch (err) {
        el("run-msg").textContent = String(err);
      }
    }

    async function startRun() {
      if (!state.selectedProjectId) {
        el("run-msg").textContent = "请先在左侧选择项目";
        return;
      }
      if (!state.selectedTaskId) {
        el("run-msg").textContent = "请先在中间列新建并选择任务";
        return;
      }
      await syncTaskFromForm();
      const requirement = el("run-requirement").value.trim();
      const requirementPrdPath = el("run-prd-path").value.trim();
      if (!requirement && !requirementPrdPath) {
        el("run-msg").textContent = "请填写需求文本或 PRD 路径";
        return;
      }
      try {
        const payload = {
          project_id: state.selectedProjectId,
          requirement_name: getTaskName(),
          requirement,
          requirement_prd_path: requirementPrdPath,
          tool: "omp",
          skip_clarification: state.flags.skipClar,
          headless_all_nodes: false,
          fresh: false,
          skip_mcp_setup: false,
        };
        const data = await api("/api/runs", { method: "POST", body: JSON.stringify(payload) });
        state.selectedRunId = data.run.run_id;
        el("run-msg").textContent = `已启动任务: ${data.run.run_id}`;
        await loadRuns();
      } catch (err) {
        el("run-msg").textContent = String(err);
      }
    }

    async function loadRunDetail(runId) {
      const data = await api(`/api/runs/${runId}`);
      state.selectedRun = data.run || null;
      await loadTaskArtifacts(getTaskName());
      await loadTaskFiles(getTaskName());
      renderNodeGrid(state.selectedRun);
      renderRunOverview(state.selectedRun);
      renderRunDetail(state.selectedRun);
    }

    async function loadRuns() {
      try {
        const data = await api("/api/runs");
        state.runs = data.runs || [];
        const projectRuns = state.runs.filter((r) => r.project_id === state.selectedProjectId);
        if (state.selectedRunId) {
          const selected = projectRuns.find((r) => r.run_id === state.selectedRunId);
          if (selected) {
            await loadRunDetail(selected.run_id);
            return;
          }
        }
        if (state.selectedTaskId) {
          const taskName = getTaskName();
          const matched = projectRuns.find((r) => (r.requirement_name || "") === taskName);
          if (matched) {
            state.selectedRunId = matched.run_id;
            await loadRunDetail(matched.run_id);
            return;
          }
        }
        state.selectedRun = null;
        renderNodeGrid(null);
        renderRunOverview(null);
        renderRunDetail(null);
      } catch (err) {
        el("run-msg").textContent = String(err);
      }
    }

    async function loadProjects() {
      try {
        const data = await api("/api/projects");
        state.projects = data.projects || [];
        if (!state.selectedProjectId && state.projects.length) {
          state.selectedProjectId = state.projects[0].project_id;
        }
        if (state.selectedProjectId && !state.projects.some((p) => p.project_id === state.selectedProjectId)) {
          state.selectedProjectId = state.projects[0]?.project_id || "";
        }
        if (state.selectedProjectId) {
          ensureProjectTaskBucket(state.selectedProjectId);
          await loadProjectTasks(state.selectedProjectId);
        }
        renderProjects();
        renderProjectHeader();
        renderTaskList();
      } catch (err) {
        el("run-msg").textContent = String(err);
      }
    }

    async function init() {
      renderNodeGrid(null);
      await loadProjects();
      await loadRuns();
      setInterval(loadRuns, 7000);
    }

    init();
  </script>
</body>
</html>
